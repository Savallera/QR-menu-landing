<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="@@description" />
  <meta property="og:title" content="@@ogTitle" />
  <meta property="og:description" content="@@description" />
  <meta property="og:url" content="@@ogUrl" />
  <meta property="og:image" content="@@ogImage?v=@@buildVersion" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="337" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="og:locale" content="@@ogLocale" />
  <!-- /en/, /sr/, /ar/ и /zh/ нужны для превью в соцсетях: текст на них переводит Google в браузере, для поисковика это та же русская страница -->
  <meta name="robots" content="@@robots" />
  <link rel="canonical" href="@@ogUrl" />
  <meta name="copyright" content="https://showme.menu/" />
  <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
  <link rel="icon" href="/images/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png" />
  <title>@@title</title>
  <!-- язык адреса (/en/, /sr/, /ar/, /zh/); на корне пусто: там язык из выбора или браузера -->
  <script>window.LANDING_PAGE_LANGUAGE = '@@pageLanguage';</script>
  <link rel="stylesheet" href="/fonts/fonts.css?v=@@buildVersion" />
  <link rel="stylesheet" href="/styles/libs/splide.min.css?v=@@buildVersion" />
  <link rel="stylesheet" href="/styles/styles.min.css?v=@@buildVersion" />
</head>
